CONFIG_ZMK_KEYBOARD_NAME="Cygnus-M"

CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_BLE=y

CONFIG_SPI=y
CONFIG_INPUT=y

# --- PMW3610（cormoran ドライバ zmk-driver-pmw3610-with-custom-studio-rpc）---
# 旧ドライバ専用シンボル（CPI/ORIENTATION_180/SCROLL_TICK/INVERT_SCROLL_X/
# POLLING_RATE_125_SW/AUTOMOUSE_TIMEOUT_MS/MOVEMENT_THRESHOLD/CPI_DIVIDOR）は
# cormoran 版に存在しないため撤去。CPI は overlay の cpi=<1000>、
# スクロールは overlay の input processor、極性は DYA Studio から実行時に変更可。
CONFIG_PMW3610=y
# 旧 ORIENTATION_180 相当（X/Y 両反転）。向きが違えば DYA Studio で実行時修正可
CONFIG_PMW3610_INVERT_X=y
CONFIG_PMW3610_INVERT_Y=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
# 2026-09-04 idle-lag: 放置後の初動ラグ対策。REST2(既定100ms)/REST3(既定500ms)の見張り間隔を短縮。
#   約25秒以上置いた後の最初のひと転がりが最大0.5秒待たされていたのを最大0.1秒に。電池は少し減りやすくなる。
CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=50
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=100
CONFIG_PMW3610_SMART_ALGORITHM=y
# 旧 POLLING_RATE_125_SW（8ms）相当
CONFIG_PMW3610_REPORT_INTERVAL_MIN=8
# 起動不良対策: 基本10ms + 290ms = 300ms（旧フォークの POWER_UP 10->300ms を再現）
CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=290

CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# --- Pointer smoothness (BLE report cadence) ---
# Cursor update rate over BLE is capped by the connection interval to the host.
# ZMK default is a 7.5-15 ms RANGE (min=6, max=12 in 1.25 ms units); many hosts
# settle on 15 ms (~66 Hz), which makes a fast-moving cursor look stepped.
# Pin both to 6 => fixed 7.5 ms (~133 Hz), the fastest standard BLE interval.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
# Optional: remove slave latency so the first move after idle isn't delayed
# (snappier, slightly higher power). Uncomment to try:
# 2026-09-04 idle-lag: 既定30(=最大30回スキップ・初動最大約0.2秒)→4(=最大37.5ms)。0より電池に優しい折衷。
CONFIG_BT_PERIPHERAL_PREF_LATENCY=4

# --- BT reliability boost (2026-07-19: mid-use dropouts / Android instability) ---
# TX power +8 dBm: stronger radio against distance and 2.4 GHz interference.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# ZMK experimental connection tweaks: better stability with picky hosts (Android).
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Zephyr 4.1 では CONSOLE が既定で有効だが不要（RAM 節約）
CONFIG_CONSOLE=n

# ============================================================
# DYA Studio（Custom Studio Protocol）中央側（R）設定
# 見本 = cormoran dya_studio_sample.conf + DYA2 右手 conf（分割向けスタック値）
# ============================================================

# 推奨スタック・バッファ値（分割キーボード向け。ガイド記載の推奨値）
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256

# Keymap タブ
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
CONFIG_ZMK_FAST_KEYMAP=y
CONFIG_ZMK_FAST_KEYMAP_STUDIO_RPC=y
CONFIG_ZMK_FAST_KEYMAP_DEFAULT_LAYER=y

# Macro / Combo / 押下キーストリーム / 物理レイアウト
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE=y
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE_STUDIO_RPC=y

# Trackball タブ（PMW3610 の実行時設定 + runtime input processor）
CONFIG_ZMK_PMW3610_STUDIO_RPC=y
CONFIG_ZMK_PMW3610_CUSTOM_SETTINGS=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# Connection タブ（BLE 管理・接続先ごとの既定レイヤー・OS 判定）
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER=y
CONFIG_ZMK_DEFAULT_LAYER_MIN_INDEX=0
# Cygnus.keymap のレイヤー数 7（0〜6）に合わせる
CONFIG_ZMK_DEFAULT_LAYER_MAX_INDEX=6
CONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_USB=y
CONFIG_ZMK_OS_DETECTION_BLE=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y

# Settings タブ
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# Troubleshooting タブ
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y
CONFIG_ZMK_DEVTOOL=y
CONFIG_ZMK_DEVTOOL_STUDIO_RPC=y
